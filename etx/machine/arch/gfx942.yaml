# AMD Instinct MI300X (CDNA3). Sources: ROCm MI300 microarchitecture doc, CDNA3 ISA
# §9.1 cache-scope bits, LLVM AMDGPUUsage "Memory Model GFX942", ROCm GPU atomics guide,
# Chips and Cheese MI300X microbenchmarks. Costs are public seed values; phase-0
# calibration (bench/calib) overwrites them.
name: gfx942
family: CDNA3
vendor: amd
wave_size: 64
devices_per_package: 1
exec_domains:
  - {name: xcd, count: 8, cus: 38, l2_mb: 4}      # 40 CUs per XCD, 38 active
shared_cache: {kind: infinity_cache, mb: 256, coherent: false}   # memory-side, holds the snoop filter
resources:
  lds_kb: 64
  regs_per_lane: 512          # VGPR + AGPR share one 512-entry file
  max_waves_per_simd: 8
  simds_per_cu: 4
  max_wg_per_cu: 2
  lds_page_kb: 16
bandwidth: {hbm_tbs: 5.3, cache_bw_tbs: 4.3}
visibility:
  # domain = within one XCD (one L2). L1 is write-through; the consumer invalidates L1 (agent-scope buffer_inv:
  # the workgroup-scope one leaves L1 stale outside threadgroup-split mode).
  # poll = agent-scope atomic load (bypasses L2). The inv-L1 + L2 load variant is 25% faster IDLE
  # (642 vs 873 ns) but on the full model it costs 5% (4.84 vs 4.60 ms/token, 2026-09-23): 36 CUs
  # per XCD polling through the L2 slow the 37 CUs streaming weights through it. Load beats latency.
  domain:
    release: ['asm volatile("s_waitcnt vmcnt(0)" ::: "memory");']
    # buffer_inv sc1, not sc0: measured 2026-09-27 (bench/sync/sync_bench.hip modes xcd / xcd1, uc / uc1): with sc0 a
    # consumer re-reading lines it read before sees its stale L1 copy (64 B and 8 KB payloads stale in almost every
    # round, same XCD or uncached memory); with sc1 0 stale, and the same-XCD one-way hand-off is 0.96 us.
    acquire: ['asm volatile("buffer_inv sc1" ::: "memory");']
    # -DETX_ACQUIRE_DOMAIN_RELAXED: the old sc0 acquire. Correct only if no consumer re-reads a protected line that is
    # still in its L1 (true when a task streams MBs through L1 between reuses, as fleet's tiles do: 32/32 tokens and
    # 27/27 layers every run), but not guaranteed. Measured 2026-09-27 on DeepSeek-V2-Lite (48 domain events/layer):
    # 3.78 ms/token relaxed vs 4.04 with sc1; Qwen3-8B 6.14 vs 6.15.
    acquire_relaxed: ['asm volatile("buffer_inv sc0" ::: "memory");']
    poll: '__hip_atomic_load({ptr}, __ATOMIC_RELAXED, __HIP_MEMORY_SCOPE_AGENT)'
    arrive: '__hip_atomic_fetch_sub({ptr}, 1, __ATOMIC_RELAXED, __HIP_MEMORY_SCOPE_AGENT)'
    memory: any
  # device = across XCDs. Producer writes back its dirty L2 lines (payload); consumer invalidates.
  device:
    release: ['asm volatile("buffer_wbl2 sc1\n\ts_waitcnt vmcnt(0)" ::: "memory");']
    acquire: ['asm volatile("buffer_inv sc1" ::: "memory");']
    poll: '__hip_atomic_load({ptr}, __ATOMIC_RELAXED, __HIP_MEMORY_SCOPE_AGENT)'
    arrive: '__hip_atomic_fetch_sub({ptr}, 1, __ATOMIC_RELAXED, __HIP_MEMORY_SCOPE_AGENT)'
    memory: any
  # system = across devices. Coarse-grained memory silently downgrades to device scope.
  system:
    release: ['asm volatile("buffer_wbl2 sc0 sc1\n\ts_waitcnt vmcnt(0)" ::: "memory");']
    acquire: ['asm volatile("buffer_inv sc0 sc1" ::: "memory");']
    poll: '__hip_atomic_load({ptr}, __ATOMIC_RELAXED, __HIP_MEMORY_SCOPE_SYSTEM)'
    arrive: '__hip_atomic_fetch_sub({ptr}, 1, __ATOMIC_RELAXED, __HIP_MEMORY_SCOPE_SYSTEM)'
    memory: fine_grained
capabilities:
  cluster_launch: false
  dsmem: false
  multicast_reduce: false        # no multimem, and no switch: 8 GPUs are a point-to-point xGMI mesh
  async_copy_to_lds: dword_only  # buffer_load ... lds is 32 bit/lane; no TMA / cp.async
  tma: false
  fp_atomic_over_fabric: true
  wg_to_domain_map: discover     # docs say round-robin; not contractual; read HW_ID.XCC_ID at start
  cooperative_launch: true
  sentinel_signal: true
  hw_tile_trigger: false
  backoff: s_sleep
  comm_fusion_reduce_scatter: experimental   # no multimem path; see design §10.4
costs:                           # MEASURED 2026-09-22, Hot Aisle 1xMI300X VM, ROCm 7.2.4, bench/calib
  t_local_ns: 642                # same-XCD one-way, DOMAIN protocol (RMW at fabric + inv-L1 poll)
  t_cross_ns: 742                # cross-XCD one-way, same poll; +100 ns, not the 2x public pure-atomic gap
  t_flag_cross_ns: 916           # one-way flag with payload, DEVICE protocol, 0 stale in 10k
  t_flag_local_ns: 951
  t_fence_ns: 181                # buffer_wbl2 sc1 + s_waitcnt (release); acquire buffer_inv sc1 = 120
  t_fence_domain_ns: 44          # s_waitcnt + buffer_inv (measured with sc0; sc1 hand-off 0.96 us one-way, 2026-09-27)
  t_phase_switch_counter_ns: 8600   # MEASURED: 304 WGs 8.6 us, 608 WGs 17.3 us per whole-GPU counter barrier (Kog: 7.6)
  t_phase_switch_leader_flags_ns: 52000   # leader polling 304 flag words: 52 us; sentinel gains are point-to-point, not barriers
  t_phase_switch_sentinel_ns: 850         # public (Kog), point-to-point payload polling
  t_dev_ns: 1000                 # MEASURED 2026-09-23 (p2p_sync): one-way, flag in the CONSUMER's fine-grained memory, idle
  t_dev_loaded_ns: 3000          # same under 2x1 GB streaming load on both GPUs; via host pinned memory 2-6 us;
                                 # polling a REMOTE flag without payload is the pathological case (10.7 us)
  peer_store_gbs: 285            # MEASURED: device 1 -> device 0 HBM, 256 MB, xGMI
  t_pop_ns: 870                  # ticket ring, uncontended
  t_push_ns: 600                 # atomicAdd(tail) + atomicExch(slot), estimate from pop cost
  queue_contention_us_per_pop: {1: 0.87, 8: 0.94, 64: 1.34, 128: 1.97, 256: 4.64, 512: 6.69}   # per popper, N poppers
  t_prologue_ns: null
  relay_min_pollers: 64          # P5 turns the per-domain relay on above this many pollers of one DEVICE word
lowering:
  # words between event counters (ETX_EV_STRIDE): 32 = one 128 B line per counter. Packed, the 8 coordinates of an XCD-local
  # event share a line: hand-off 3.3 us vs 1.0 us (bench/hw/hw_bench.hip handoff); DeepSeek-V2-Lite 3.72 -> 3.47 ms/token,
  # two requests 365 -> 416 tokens/s (2026-09-27, examples/sessions/ds_evstride.py)
  event_stride_words: 32
  backoff: '__builtin_amdgcn_s_sleep(8);'   # ~256 cycles between polls; 8 vs 1 measured 4.59 vs 4.60 ms/token
  timer: '__builtin_amdgcn_s_memrealtime()'
  domain_id: 'etx_amdgcn_xcc_id()'          # runtime/include/etx/primitives_amdgcn.h
  prio_high: 'asm volatile("s_setprio 3");'  # relay waves win issue arbitration (fleet does the same)
  prio_normal: 'asm volatile("s_setprio 0");'
  launch: hipLaunchCooperativeKernel
notes:
  - "Plain and sc0 loads hit the stale per-CU L1 and never observe an arrive (measured); poll via buffer_inv sc0 + load or agent atomic load."
  - "Workgroup k landed on XCD (k+6) mod 8 on the 2026-09-22 VM: round-robin with an offset, so discovery via HW_ID is mandatory."
# Tile primitives (docs/PLAN-generic-decoder-2026-10-08.md section 6.4). Each entry is the C definition that
# etx/ops/prims.py emits for this machine. The tile generators call the primitive by name only.
# wave_sum is the text of etx_wave_sum in etx/runtime/include/etx/tile_util.h (a test keeps the two equal).
# wave_sum0 is the ETX_DSL_WSUM reduction of etx/ops/gemv.py.
primitives:
  wave_sum: |
    static __device__ __forceinline__ float etx_wave_sum(float v) {
      for (int off = ETX_WAVE_SIZE / 2; off > 0; off >>= 1) v += __shfl_xor(v, off, ETX_WAVE_SIZE);
      return v;
    }
  wave_sum0: |
    // etx_wave_sum's butterfly (partners at lane distance 32, 16, 8, 4, 2, 1) with only lane 0's result defined, so each
    // step need be exact only on the lanes lane 0 later reads: 32 by ds_bpermute, 16 by ds_swizzle's xor mode (exact in
    // each 32-lane half), 8 by DPP row_ror:8 (= xor 8 inside a 16-lane row), 4 by row_shl:4 (lane i reads i + 4: exact
    // on lanes 0-3, all the later steps read), 2 and 1 by quad_perm. Every lane lane 0 depends on adds the same two
    // values as in etx_wave_sum, and fp32 addition commutes, so lane 0 is bit-identical; the other lanes hold partial
    // sums. Replaces four of six LDS-pipe round trips and the per-step lane-index arithmetic of __shfl_xor.
    static_assert(ETX_WAVE_SIZE == 64, "dsl_wave_sum0 is written for wave64");
    static __device__ __forceinline__ float dsl_wave_sum0(float v) {
      v += __int_as_float(__builtin_amdgcn_ds_bpermute((etx_lane() ^ 32) << 2, __float_as_int(v)));
      v += __int_as_float(__builtin_amdgcn_ds_swizzle(__float_as_int(v), 0x401f));                  // and 0x1f, xor 0x10
      v += __int_as_float(__builtin_amdgcn_update_dpp(0, __float_as_int(v), 0x128, 0xf, 0xf, false)); // row_ror:8
      v += __int_as_float(__builtin_amdgcn_update_dpp(0, __float_as_int(v), 0x104, 0xf, 0xf, false)); // row_shl:4
      v += __int_as_float(__builtin_amdgcn_update_dpp(0, __float_as_int(v), 0x4e, 0xf, 0xf, false));  // quad_perm [2,3,0,1]
      v += __int_as_float(__builtin_amdgcn_update_dpp(0, __float_as_int(v), 0xb1, 0xf, 0xf, false));  // quad_perm [1,0,3,2]
      return v;
    }
