[project]
name = "etx"
version = "0.1.0"
description = "ETX: DSL-agnostic, chiplet-aware compiler for dynamic GPU megakernels"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
etx = "etx.tools.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["etx*"]

[tool.setuptools.package-data]
etx = ["machine/arch/*.yaml", "runtime/include/etx/*.h"]
