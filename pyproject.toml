[project]
name = "etx"
version = "0.1.0"
description = "ETX: DSL-agnostic, chiplet-aware compiler for dynamic GPU megakernels"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "numpy>=1.26", "build>=1.2", "setuptools>=68", "wheel"]
reference = ["numpy>=1.26", "torch>=2.6", "transformers>=4.57,<6", "safetensors>=0.5"]

[project.scripts]
etx = "etx.tools.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["etx*"]

[tool.setuptools.package-data]
etx = ["ops/*.h", "machine/arch/*.yaml", "runtime/include/etx/*.h", "importer/specs/*.json",
       "importer/*.sh", "importer/shim/**/*.h", "importer/shim/**/*.cuh",
       "importer/shim_nofp8/**/*.h", "importer/shim_nofp8/**/*.cuh",
       "testing/data/sealed/*.hip", "testing/data/sealed/*.json", "experiments/specs.json",
       "operators/tiles/*.hip", "operators/hosts/*.hip", "session/*.sh", "models/vllm_llm/*.sh"]
